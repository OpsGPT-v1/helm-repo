{{- range $serviceName, $service := .Values.services }}
{{- if and $service.enabled $service.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-{{ $service.name }}-hpa
  namespace: {{ $.Values.global.namespace | default $.Release.Namespace }}
  labels:
    app: {{ $service.name }}
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/component: {{ $service.component }}
    app.kubernetes.io/part-of: opsgpt
    environment: {{ $.Values.global.environment }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Release.Name }}-{{ $service.name }}
  minReplicas: {{ $service.autoscaling.minReplicas }}
  maxReplicas: {{ $service.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $service.autoscaling.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- end }}
