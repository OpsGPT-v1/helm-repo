{{- range $serviceName, $service := .Values.services }}
{{- if $service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $service.name }}
  namespace: {{ $.Values.global.namespace | default $.Release.Namespace }}
  labels:
    app: {{ $service.name }}
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/component: {{ $service.component }}
    app.kubernetes.io/part-of: opsgpt
    environment: {{ $.Values.global.environment }}
spec:
  type: {{ $service.service.type | default "ClusterIP" }}
  ports:
    - port: {{ $service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ $service.name }}
    environment: {{ $.Values.global.environment }}
---
{{- end }}
{{- end }}
