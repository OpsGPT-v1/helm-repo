global:
  environment: dev
  namespace: dev
  registry: "opsgpt.azurecr.io"
  imagePullPolicy: IfNotPresent
  keyVaultName: "opsgpt-kv-aasik-tf"
  tenantId: "d8537334-bc24-4daf-95a8-bf4c9fb14394"

ingress:
  enabled: true
  className: azure-application-gateway
  host: ""
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/health-probe-path: /health
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
  tls:
    enabled: false
    secretName: ""

services:
  frontend-service:
    enabled: true
    name: frontend-service
    component: frontend
    image:
      repository: opsgpt/frontend-service
      tag: latest
    port: 3000
    replicas: 2
    service:
      type: ClusterIP
    serviceAccount:
      clientId: "6052dc97-db6d-4c5a-b64a-66b527c7732e"
    probes:
      livenessPath: /health
      readinessPath: /health
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    keyvault:
      enabled: false
      secrets:
        - name: "placeholder-secret"
          alias: "PLACEHOLDER_SECRET"

  core-api-service:
    enabled: true
    name: core-api-service
    component: backend
    image:
      repository: opsgpt/core-api-service
      tag: latest
    port: 8001
    replicas: 2
    service:
      type: ClusterIP
    serviceAccount:
      clientId: "6052dc97-db6d-4c5a-b64a-66b527c7732e"
    probes:
      livenessPath: /health
      readinessPath: /health
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    keyvault:
      enabled: true
      secrets:
        - name: "database-url"
          alias: "DATABASE_URL"
        - name: "jwt-secret-key"
          alias: "JWT_SECRET_KEY"
        - name: "internal-api-key"
          alias: "INTERNAL_API_KEY"
    env:
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRE_MINUTES: "60"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8004"
      ENABLE_NOTIFICATIONS: "true"
      APP_ENV: "development"
      CORS_ORIGINS: "*"

  alert-ingestion-service:
    enabled: true
    name: alert-ingestion-service
    component: backend
    image:
      repository: opsgpt/alert-ingestion-service
      tag: latest
    port: 8002
    replicas: 2
    service:
      type: ClusterIP
    serviceAccount:
      clientId: "6052dc97-db6d-4c5a-b64a-66b527c7732e"
    probes:
      livenessPath: /health
      readinessPath: /health
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    keyvault:
      enabled: true
      secrets:
        - name: "database-url"
          alias: "DATABASE_URL"
        - name: "internal-api-key"
          alias: "INTERNAL_API_KEY"
    env:
      AI_ANALYSIS_SERVICE_URL: "http://ai-analysis-service:8003"
      CORE_API_URL: "http://core-api-service:8001"
      ENABLE_ANALYSIS_FORWARDING: "true"
      APP_ENV: "development"
      CORS_ORIGINS: "*"

  ai-analysis-service:
    enabled: true
    name: ai-analysis-service
    component: backend
    image:
      repository: opsgpt/ai-analysis-service
      tag: latest
    port: 8003
    replicas: 2
    service:
      type: ClusterIP
    serviceAccount:
      clientId: "6052dc97-db6d-4c5a-b64a-66b527c7732e"
    probes:
      livenessPath: /health
      readinessPath: /health
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    keyvault:
      enabled: true
      secrets:
        - name: "database-url"
          alias: "DATABASE_URL"
        - name: "internal-api-key"
          alias: "INTERNAL_API_KEY"
        - name: "azure-foundry-api-key"
          alias: "AZURE_FOUNDRY_API_KEY"
    env:
      CORE_API_URL: "http://core-api-service:8001"
      CORRELATION_WINDOW_MINUTES: "10"
      AI_PROVIDER: "azure_foundry"
      AZURE_FOUNDRY_API_MODE: "responses"
      AZURE_FOUNDRY_ENDPOINT: "https://opsgpt-ai-aasik.openai.azure.com/openai/v1"
      AZURE_FOUNDRY_MODEL: "gpt-model-deploy"
      AZURE_FOUNDRY_API_VERSION: "2025-04-01-preview"
      AZURE_FOUNDRY_TIMEOUT_SECONDS: "60"
      AZURE_FOUNDRY_MAX_RETRIES: "2"
      AZURE_FOUNDRY_TEMPERATURE: "0.2"
      APP_ENV: "development"
      CORS_ORIGINS: "*"

  notification-service:
    enabled: true
    name: notification-service
    component: backend
    image:
      repository: opsgpt/notification-service
      tag: latest
    port: 8004
    replicas: 2
    service:
      type: ClusterIP
    serviceAccount:
      clientId: "6052dc97-db6d-4c5a-b64a-66b527c7732e"
    probes:
      livenessPath: /health
      readinessPath: /health
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    keyvault:
      enabled: true
      secrets:
        - name: "database-url"
          alias: "DATABASE_URL"
        - name: "slack-webhook-url"
          alias: "SLACK_WEBHOOK_URL"
    env:
      NOTIFICATION_CHANNEL: "console"
      NOTIFICATION_RETRY_COUNT: "3"
      NOTIFICATION_TIMEOUT_SECONDS: "10"
      APP_ENV: "development"
      CORS_ORIGINS: "*"
